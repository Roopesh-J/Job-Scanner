[project]
name = "job-scanner"
version = "0.1.0"
description = "Traceable job posting extraction and resume-aware fit analysis."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.6",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "sentence-transformers<3.0",
    "numpy<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["job_scanner*"]
